name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: Check cross-user access rules
        run: |
          source supabase.env
          SUPABASE_URL=$API_URL SUPABASE_KEY=$ANON_KEY npm run rls-check
      # Fails when a migration changed without regenerating and committing src/db/database.types.ts
      # (lessons.md: ship the schema before the code that needs it).
      - name: Check database types match migrations
        run: |
          npx supabase gen types typescript --local > "$RUNNER_TEMP/database.types.ts"
          diff -u src/db/database.types.ts "$RUNNER_TEMP/database.types.ts"
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  deploy:
    needs: [ci, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
